spring:
  application:
    name: plagiacheck
  datasource:
    url: jdbc:h2:mem:plagiacheck;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    open-in-view: false
  # ── File Upload ────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

# ── Server ────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── JWT ────────────────────────────────────────────────────────
jwt:
  secret: PlagiaCheckSuperSecretKey2026XYZABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmn
  expiration: 86400000   # 24 hours in ms

# ── File Storage ───────────────────────────────────────────────
file:
  upload-dir: ./uploads

# ── Actuator ───────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.codethon.microsoft: DEBUG
    org.springframework.security: WARN
