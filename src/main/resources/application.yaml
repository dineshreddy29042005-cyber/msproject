spring:
  application:
    name: plagiacheck

  # ── H2 in-memory (relational / auth layer) ────────────────
  datasource:
    url: jdbc:h2:mem:plagiacheck;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  # ── File Upload ────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

# ── Server ────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /

# ── JWT ────────────────────────────────────────────────────────
jwt:
  secret: PlagiaCheckSuperSecretKey2026XYZABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmn
  expiration: 86400000

# ── File Storage ───────────────────────────────────────────────
file:
  upload-dir: ./uploads

# ── Local DynamoDB ─────────────────────────────────────────────
dynamodb:
  endpoint: http://localhost:8000
  region: us-east-1
  access-key: 2bqvic
  secret-key: n1lfv6
  # Tables to auto-create on startup
  tables:
    users:         pc_users
    documents:     pc_documents
    analysis:      pc_analysis_results
    matches:       pc_plagiarism_matches

# ── Actuator ───────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ── Logging ────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    com.codethon.microsoft: DEBUG
    org.springframework.security: WARN
    software.amazon.awssdk: WARN
