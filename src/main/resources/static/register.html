<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Register — PlagiaCheck</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap');
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#0A0C18;color:#EEF0FF;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
    .bg{position:fixed;inset:0;z-index:0}
    .blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.12}
    .b1{width:600px;height:600px;background:#6C63FF;top:-200px;left:-150px}
    .b2{width:500px;height:500px;background:#00D9B5;bottom:-150px;right:-100px}
    .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(108,99,255,.04)1px,transparent 1px),linear-gradient(90deg,rgba(108,99,255,.04)1px,transparent 1px);background-size:50px 50px}
    .card{position:relative;z-index:1;background:#111326;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:2.5rem;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
    .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:2rem}
    .logo-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#6C63FF,#00D9B5);display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:1.1rem;color:#fff;box-shadow:0 4px 20px rgba(108,99,255,.4)}
    .logo-name{font-family:'Sora',sans-serif;font-size:1.3rem;font-weight:800}
    .title{font-family:'Sora',sans-serif;font-size:1.45rem;font-weight:800;text-align:center;margin-bottom:.4rem}
    .subtitle{font-size:.87rem;color:#8B90B8;text-align:center;margin-bottom:2rem}
    .alert{display:none;padding:.85rem 1rem;border-radius:10px;font-size:.85rem;margin-bottom:1rem;background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);color:#ff6b87;align-items:center;gap:.6rem}
    .alert.success{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#4ade80}
    .group{margin-bottom:1.1rem}
    label{display:block;font-size:.82rem;font-weight:600;color:#8B90B8;margin-bottom:.45rem}
    .input-wrap{position:relative}
    .input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:#4A4F6A;font-size:.9rem;pointer-events:none}
    input,select{width:100%;background:#161828;border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:.72rem 1rem .72rem 2.75rem;color:#EEF0FF;font-size:.9rem;font-family:'Inter',sans-serif;outline:none;transition:all .2s;appearance:none}
    input:focus,select:focus{border-color:#6C63FF;box-shadow:0 0 0 3px rgba(108,99,255,.12)}
    input::placeholder{color:#4A4F6A}
    .eye-btn{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:#4A4F6A;cursor:pointer;font-size:.9rem;transition:color .2s}
    .eye-btn:hover{color:#6C63FF}
    .err{font-size:.75rem;color:#FF4D6D;margin-top:.3rem;display:none}
    /* Password strength */
    .strength{margin-top:6px}
    .s-bars{display:flex;gap:4px}
    .s-bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);transition:background .3s}
    .s-label{font-size:.72rem;color:#4A4F6A;margin-top:4px}
    .btn{width:100%;padding:.75rem;border:none;border-radius:10px;font-size:.95rem;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .25s;margin-top:.5rem}
    .btn-primary{background:linear-gradient(135deg,#6C63FF,#5548e0);color:#fff;box-shadow:0 4px 20px rgba(108,99,255,.35)}
    .btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 28px rgba(108,99,255,.45)}
    .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
    .spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .footer{text-align:center;font-size:.84rem;color:#8B90B8;margin-top:1.5rem}
    .footer a{color:#6C63FF;font-weight:600;text-decoration:none}
    .footer a:hover{text-decoration:underline}
    .role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-top:.4rem}
    .role-btn{padding:.6rem .5rem;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:#161828;color:#8B90B8;font-size:.8rem;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;text-align:center;transition:all .2s}
    .role-btn:hover{border-color:#6C63FF;color:#6C63FF}
    .role-btn.active{border-color:#6C63FF;background:rgba(108,99,255,.15);color:#6C63FF}
    .toast-c{position:fixed;top:1.5rem;right:1.5rem;z-index:999}
    .toast{padding:.75rem 1.1rem;border-radius:10px;background:#111326;border:1px solid rgba(34,197,94,.4);color:#4ade80;font-size:.85rem;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  </style>
</head>
<body>
<div class="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="grid"></div>
</div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">P</div>
    <span class="logo-name">PlagiaCheck</span>
  </div>

  <h1 class="title">Create your account</h1>
  <p class="subtitle">Start checking documents for plagiarism — free forever</p>

  <div class="alert" id="regAlert"><i class="fa-solid fa-circle-exclamation"></i><span id="alertMsg"></span></div>

  <form id="registerForm" novalidate>
    <div class="group">
      <label>Username</label>
      <div class="input-wrap">
        <i class="input-icon fa-regular fa-user"></i>
        <input type="text" id="regUsername" placeholder="e.g. john_doe" required/>
      </div>
      <div class="err" id="uErr">Must be at least 3 characters</div>
    </div>

    <div class="group">
      <label>Email Address</label>
      <div class="input-wrap">
        <i class="input-icon fa-regular fa-envelope"></i>
        <input type="email" id="regEmail" placeholder="you@example.com" required/>
      </div>
      <div class="err" id="eErr">Enter a valid email address</div>
    </div>

    <div class="group">
      <label>I am a…</label>
      <div class="role-grid">
        <button type="button" class="role-btn active" onclick="setRole('STUDENT',this)">🎓 Student</button>
        <button type="button" class="role-btn" onclick="setRole('TEACHER',this)">👨‍🏫 Teacher</button>
        <button type="button" class="role-btn" onclick="setRole('ADMIN',this)">⚙️ Admin</button>
      </div>
      <input type="hidden" id="regRole" value="STUDENT"/>
    </div>

    <div class="group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="input-icon fa-solid fa-lock"></i>
        <input type="password" id="regPassword" placeholder="Minimum 6 characters" required/>
        <button type="button" class="eye-btn" id="eyeBtn2"><i class="fa-regular fa-eye"></i></button>
      </div>
      <div class="strength">
        <div class="s-bars">
          <div class="s-bar" id="sb1"></div>
          <div class="s-bar" id="sb2"></div>
          <div class="s-bar" id="sb3"></div>
          <div class="s-bar" id="sb4"></div>
        </div>
        <div class="s-label" id="sLabel">Enter a password</div>
      </div>
      <div class="err" id="pErr">Password must be at least 6 characters</div>
    </div>

    <button type="submit" class="btn btn-primary" id="regBtn">
      <span id="regLabel"><i class="fa-solid fa-user-plus"></i> Create Account</span>
      <span id="regSpinner" style="display:none"><div class="spinner"></div> Creating…</span>
    </button>
  </form>

  <div class="footer">Already have an account? <a href="login.html">Sign in</a></div>
  <div class="footer" style="margin-top:.5rem"><a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to home</a></div>
</div>

<div class="toast-c" id="toastContainer"></div>
<script src="js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = '/advanced-dashboard.html';

  function setRole(role, btn) {
    document.getElementById('regRole').value = role;
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  }

  // Eye toggle
  document.getElementById('eyeBtn2').addEventListener('click', () => {
    const inp = document.getElementById('regPassword');
    const icon = document.getElementById('eyeBtn2').querySelector('i');
    if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fa-regular fa-eye-slash'; }
    else { inp.type = 'password'; icon.className = 'fa-regular fa-eye'; }
  });

  // Strength meter
  document.getElementById('regPassword').addEventListener('input', () => {
    const v = document.getElementById('regPassword').value;
    const colors = ['#FF4D6D','#FF7A00','#FFB547','#22C55E'];
    const labels = ['Too weak','Weak','Moderate','Strong'];
    let s = 0;
    if (v.length >= 6) s++;
    if (v.length >= 10) s++;
    if (/[A-Z]/.test(v) && /[0-9]/.test(v)) s++;
    if (/[^A-Za-z0-9]/.test(v)) s++;
    [1,2,3,4].forEach(i => {
      document.getElementById('sb'+i).style.background = i <= s ? colors[s-1] : 'rgba(255,255,255,.08)';
    });
    const lbl = document.getElementById('sLabel');
    lbl.textContent = v.length === 0 ? 'Enter a password' : (labels[s-1]||'Too weak');
    lbl.style.color = v.length === 0 ? '#4A4F6A' : colors[s-1];
  });

  function showAlert(msg, type='error') {
    const a = document.getElementById('regAlert');
    document.getElementById('alertMsg').textContent = msg;
    a.className = 'alert' + (type==='success'?' success':'');
    a.style.display = 'flex';
  }

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    document.getElementById('regAlert').style.display = 'none';
    const username = document.getElementById('regUsername').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const role     = document.getElementById('regRole').value;
    let ok = true;

    ['uErr','eErr','pErr'].forEach(id => document.getElementById(id).style.display='none');

    if (!username || username.length < 3) { document.getElementById('uErr').style.display='block'; ok=false; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { document.getElementById('eErr').style.display='block'; ok=false; }
    if (!password || password.length < 6) { document.getElementById('pErr').style.display='block'; ok=false; }
    if (!ok) return;

    document.getElementById('regLabel').style.display  = 'none';
    document.getElementById('regSpinner').style.display = 'flex';
    document.getElementById('regBtn').disabled = true;

    try {
      const data = await API.auth.register({ username, email, password, role });
      Auth.setSession(data);
      showAlert('Account created! Redirecting…', 'success');
      setTimeout(() => window.location.href = '/advanced-dashboard.html', 900);
    } catch (err) {
      document.getElementById('regLabel').style.display   = 'flex';
      document.getElementById('regSpinner').style.display = 'none';
      document.getElementById('regBtn').disabled = false;
      showAlert(err.message || 'Registration failed. Try again.');
    }
  });
</script>
</body>
</html>
